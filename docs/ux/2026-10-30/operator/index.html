  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;operator-options&#x27;);
      const frameTemplate = root.querySelector(&#x27;#operator-frame-template&#x27;);
      const composerTemplate = root.querySelector(&#x27;#operator-composer-template&#x27;);
      const chatState = new WeakMap();
      const sessions = {
        claude:{title:&#x27;Claude #151 · Release review · running&#x27;,label:&#x27;Claude / Release review&#x27;,text:&#x27;Reviewing release-review in spacelift.\n\nI’ll inspect the branch and report release blockers.\n\n* Review in progress…&#x27;},
        pi:{title:&#x27;Pi #152 · Second opinion · needs input&#x27;,label:&#x27;Pi / Second opinion&#x27;,text:&#x27;I’m ready to review release-review.\n\nWhich branch should I compare against?\n\n&gt; Waiting for input&#x27;}
      };
      root.querySelectorAll(&#x27;.m-screen&#x27;).forEach((screen,index) =&gt; {
        const content = screen.querySelector(&#x27;.m-design-content&#x27;);
        const fragment = frameTemplate.content.cloneNode(true);
        fragment.querySelector(&#x27;.m-content-host&#x27;).append(content);
        fragment.querySelector(&#x27;.m-bottom&#x27;).append(composerTemplate.content.cloneNode(true));
        screen.append(fragment);
        chatState.set(screen,{selected:&#x27;release&#x27;,drafts:{release:&#x27;&#x27;,cleanup:&#x27;&#x27;,staging:&#x27;&#x27;,new:&#x27;&#x27;},threads:{},nextId:1,dialogContext:&#x27;&#x27;,returnFocus:null});
        const tabs=screen.querySelectorAll(&#x27;[data-preview]&#x27;);
        tabs.forEach((tab,tabIndex)=&gt;{tab.id=&#x27;session-tab-&#x27;+index+&#x27;-&#x27;+tabIndex;tab.setAttribute(&#x27;aria-controls&#x27;,&#x27;session-panel-&#x27;+index);});
        const panel=screen.querySelector(&#x27;[role=&quot;tabpanel&quot;]&#x27;);
        if(panel) { panel.id=&#x27;session-panel-&#x27;+index; panel.setAttribute(&#x27;aria-labelledby&#x27;,&#x27;session-tab-&#x27;+index+&#x27;-1&#x27;); }
        const design={width:&#x27;Full width&#x27;,appearance:&#x27;Follow theme&#x27;};
        function renderDesign() {
          screen.style.maxWidth=design.width===&#x27;Full width&#x27;?&#x27;none&#x27;:(design.width===&#x27;80 columns&#x27;?&#x27;80ch&#x27;:&#x27;60ch&#x27;);
          screen.classList.toggle(&#x27;m-narrow&#x27;,design.width!==&#x27;Full width&#x27;);
          screen.style.colorScheme=design.appearance===&#x27;Follow theme&#x27;?&#x27;light dark&#x27;:design.appearance.toLowerCase();
        }
        renderDesign();
        if(globalThis.Tweak) {
          const tweak=new Tweak({container:screen,onChange:renderDesign});
          tweak.addSelect(design,&#x27;width&#x27;,{label:&#x27;Terminal width&#x27;,options:[&#x27;Full width&#x27;,&#x27;80 columns&#x27;,&#x27;60 columns&#x27;]});
          tweak.addSelect(design,&#x27;appearance&#x27;,{label:&#x27;Appearance&#x27;,options:[&#x27;Follow theme&#x27;,&#x27;Dark&#x27;,&#x27;Light&#x27;]});
        }
      });
      function agentView(screen) {
        screen.querySelector(&#x27;.m-agent-view&#x27;).hidden=false;
        screen.querySelector(&#x27;.m-session-view&#x27;).hidden=true;
        screen.classList.remove(&#x27;m-nav-open&#x27;);
        screen.querySelector(&#x27;[data-nav]&#x27;).setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
        const state=chatState.get(screen);
        screen.querySelectorAll(&#x27;.m-session-row&#x27;).forEach(button=&gt;button.classList.remove(&#x27;is-active&#x27;));
        screen.querySelectorAll(&#x27;.m-chat&#x27;).forEach(button=&gt;button.classList.toggle(&#x27;is-active&#x27;,button.dataset.conversation===state.selected));
      }
      function selectConversation(screen,id) {
        const state=chatState.get(screen);
        const input=screen.querySelector(&#x27;textarea&#x27;);
        state.drafts[state.selected]=input.value;
        state.selected=id;
        input.value=state.drafts[id];
        agentView(screen);
        const existing=screen.querySelector(&#x27;.m-quick-thread&#x27;);
        if(existing) existing.remove();
        const content=screen.querySelector(&#x27;.m-design-content&#x27;);
        content.hidden=id!==&#x27;release&#x27;;
        const titles={release:&#x27;Release review&#x27;,cleanup:&#x27;Session cleanup&#x27;,staging:&#x27;Prepare staging&#x27;,new:&#x27;New conversation&#x27;};
        const contexts={release:&#x27;Managing spacelift / release-review · 2 sessions&#x27;,cleanup:&#x27;Managing ovrcr / main&#x27;,staging:&#x27;Managing spacelift-agent / staging&#x27;,new:&#x27;No workspace selected&#x27;};
        const thread=state.threads[id];
        screen.querySelector(&#x27;.m-chat-header strong&#x27;).textContent=thread?.title||titles[id];
        screen.querySelector(&#x27;.m-context&#x27;).textContent=thread?&#x27;Managing &#x27;+thread.context:contexts[id];
        input.placeholder=id===&#x27;release&#x27;?&#x27;Tell Pi to compare against main…&#x27;:&#x27;Message Operator…&#x27;;
        screen.querySelectorAll(&#x27;.m-chat&#x27;).forEach(button=&gt;{const selected=button.dataset.conversation===id;button.classList.toggle(&#x27;is-active&#x27;,selected);button.setAttribute(&#x27;aria-pressed&#x27;,String(selected));});
        const selectedRow=screen.querySelector(&#x27;[data-chat-row=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
        const unread=selectedRow?.querySelector(&#x27;[data-status=&quot;unread&quot;]&#x27;);
        if(unread) { unread.textContent=&#x27; &#x27;; unread.dataset.status=&#x27;idle&#x27;; unread.setAttribute(&#x27;aria-label&#x27;,&#x27;No unread reply&#x27;); }
        if(id!==&#x27;release&#x27;) {
          const copy={cleanup:&#x27;The requested sessions have been closed. The workspace is retained.&#x27;,staging:&#x27;Staging workspace is ready. Its sessions are available in Projects.&#x27;,new:&#x27;What would you like Operator to manage?&#x27;};
          const view=document.createElement(&#x27;div&#x27;);
          view.className=&#x27;m-quick-thread&#x27;;
          if(thread) {
            const message=document.createElement(&#x27;div&#x27;);message.className=&#x27;m-message m-user&#x27;;
            const role=document.createElement(&#x27;span&#x27;);role.className=&#x27;m-role&#x27;;role.textContent=&#x27;You&#x27;;
            const text=document.createElement(&#x27;div&#x27;);text.style.whiteSpace=&#x27;pre-wrap&#x27;;text.textContent=thread.message;
            message.append(role,text);
            const activity=document.createElement(&#x27;div&#x27;);activity.className=&#x27;m-muted&#x27;;activity.textContent=&#x27;⠋ Working…&#x27;;
            view.append(message,activity);
          } else view.textContent=copy[id];
          screen.querySelector(&#x27;.m-content-host&#x27;).append(view);
        }
      }
      function setDialog(screen,open) {
        screen.querySelector(&#x27;.m-dialog-layer&#x27;).hidden=!open;
        screen.querySelector(&#x27;.m-top&#x27;).inert=open;
        screen.querySelector(&#x27;.m-shell&#x27;).inert=open;
      }
      function openQuickDialog(screen) {
        const state=chatState.get(screen);
        if(!screen.querySelector(&#x27;.m-dialog-layer&#x27;).hidden) return;
        state.returnFocus=document.activeElement;
        const selectedSession=screen.querySelector(&#x27;.m-session-row.is-active&#x27;)?.dataset.session;
        const targets={release:&#x27;spacelift / release-review&#x27;,cleanup:&#x27;ovrcr / main&#x27;,staging:&#x27;spacelift-agent / staging&#x27;,new:&#x27;No workspace selected&#x27;};
        state.dialogContext=!screen.querySelector(&#x27;.m-session-view&#x27;).hidden&amp;&amp;selectedSession?&#x27;spacelift / release-review / &#x27;+(selectedSession===&#x27;pi&#x27;?&#x27;Pi #152&#x27;:&#x27;Claude #151&#x27;):(state.threads[state.selected]?.context||targets[state.selected]);
        screen.querySelector(&#x27;[data-dialog-context]&#x27;).textContent=state.dialogContext;
        screen.querySelector(&#x27;[data-dialog-message]&#x27;).value=&#x27;&#x27;;
        screen.querySelector(&#x27;[data-dialog-submit]&#x27;).disabled=true;
        setDialog(screen,true);
        screen.querySelector(&#x27;[data-dialog-message]&#x27;).focus();
      }
      function cancelQuickDialog(screen) {
        setDialog(screen,false);
        const previous=chatState.get(screen).returnFocus;
        if(previous?.isConnected&amp;&amp;previous!==document.body) previous.focus();
      }
      function submitQuickDialog(screen) {
        const field=screen.querySelector(&#x27;[data-dialog-message]&#x27;);
        if(screen.querySelector(&#x27;.m-dialog-layer&#x27;).hidden||!field.value.trim()) return;
        const state=chatState.get(screen);
        const id=&#x27;quick-&#x27;+state.nextId++;
        const message=field.value;
        const title=message.trim().split(/\r?\n/,1)[0];
        state.threads[id]={title,context:state.dialogContext,message};
        state.drafts[id]=&#x27;&#x27;;
        const row=root.querySelector(&#x27;#operator-new-row-template&#x27;).content.cloneNode(true);
        row.querySelector(&#x27;.m-sidebar-row&#x27;).dataset.chatRow=id;
        row.querySelector(&#x27;.m-chat&#x27;).dataset.conversation=id;
        row.querySelector(&#x27;.m-chat&#x27;).setAttribute(&#x27;aria-label&#x27;,title);
