[package]
name = "ovrcr-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
acceptance-diagnostics = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
libc = { workspace = true }
ovrcr-protocol = { workspace = true }
ovrcr-terminal = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

tempfile = { workspace = true }
ureq = { workspace = true }

# Callback compatibility re-hashes reviewed bytes inside a fixed deadline.
# Enable RustCrypto's ARM SHA dispatch under Apple's ARM64 platform baseline; all
# other targets retain their existing implementation and soft fallback.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
sha2 = { workspace = true }
