name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR commits should not occupy runners. Keep main's runs intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      # Clippy covers compilation too; a preceding cargo check duplicates work.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    # The macOS core lane runs the full --all-features workspace gate,
    # including the GUI feature and its tests/gui.rs target, and needs more
    # time for a cold eframe build.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && matrix.suite == 'core' && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite: [core, lifecycle, tasks]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          cache-on-failure: true
      - name: Configure git identity
        run: |
          git config --global user.name "OVRCR CI"
          git config --global user.email "ci@ovrcr.invalid"
      - name: Test
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci-tests.sh "$SUITE"
