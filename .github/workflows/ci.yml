# Temporary diagnosis only. This branch must never be merged as acceptance.
name: Linux startup diagnosis
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: never
jobs:
  startup-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-headless
          cache-on-failure: true
      - name: Install shell fixture
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build exact existing test
        run: cargo test -p ovrcr --test server_lifecycle --features acceptance-diagnostics --no-run
      - name: Six independent measurements, preserving every original result
        env:
          OVRCR_STARTUP_DIAGNOSTIC: '1'
        shell: bash
        run: |
          mkdir -p target/linux-startup-diagnosis
          git rev-parse HEAD > target/linux-startup-diagnosis/revision.txt
          uname -a > target/linux-startup-diagnosis/host.txt
          rustc -Vv >> target/linux-startup-diagnosis/host.txt
          nproc >> target/linux-startup-diagnosis/host.txt
          lscpu > target/linux-startup-diagnosis/cpu.txt
          stat --printf='%s bytes\n' target/debug/ovrcr > target/linux-startup-diagnosis/executable.txt
          sha256sum target/debug/ovrcr >> target/linux-startup-diagnosis/executable.txt
          export OVRCR_STARTUP_EXPECTED_SHA256="$(sha256sum target/debug/ovrcr | cut -d ' ' -f1)"
          cat /proc/loadavg >> target/linux-startup-diagnosis/host.txt
          failed=0
          burner_pids=()
          cleanup() {
            for burner_pid in "${burner_pids[@]}"; do
              if kill "$burner_pid"; then kill_status=0; else kill_status=$?; fi
              if wait "$burner_pid"; then wait_status=0; else wait_status=$?; fi
              echo "owned_pid=$burner_pid kill_status=$kill_status original_wait_status=$wait_status" >> target/linux-startup-diagnosis/cpu-burner-cleanup.txt
            done
            burner_pids=()
          }
          trap cleanup EXIT
          for arm in baseline cpu_load; do
            if [[ "$arm" == cpu_load ]]; then
              for burner in 1 2 3 4; do
                python3 -c 'while True: pass' &
                burner_pids+=("$!")
                echo "$!" >> target/linux-startup-diagnosis/owned-cpu-burners.pid
              done
            fi
            set +e
            cargo test -p ovrcr --test server_lifecycle --features acceptance-diagnostics diagnostic_full_executable_hash_cost -- --ignored --exact --nocapture --test-threads=1 > "target/linux-startup-diagnosis/$arm-hash-bench.log" 2>&1
            bench_result=$?
            set -e
            echo "$bench_result" > "target/linux-startup-diagnosis/$arm-hash-bench.exit"
            cat "target/linux-startup-diagnosis/$arm-hash-bench.log"
            if [[ "$bench_result" != 0 ]]; then failed=1; fi
            for attempt in 1 2 3; do
              log="target/linux-startup-diagnosis/$arm-$attempt.log"
              set +e
              cargo test -p ovrcr --test server_lifecycle --features acceptance-diagnostics startup_stale_concurrent_attempts_leave_one_surviving_server -- --exact --nocapture --test-threads=1 > "$log" 2>&1
              result=$?
              set -e
              echo "$result" > "target/linux-startup-diagnosis/$arm-$attempt.exit"
              cat "$log"
              if [[ "$result" != 0 ]]; then failed=1; fi
            done
            cleanup
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-startup-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/linux-startup-diagnosis/
          if-no-files-found: error
          retention-days: 14
