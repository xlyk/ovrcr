name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR commits should not occupy runners. Keep main's runs intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    # macOS covers the GUI feature as well as the headless workspace.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          cache-on-failure: true
      - name: Configure git identity
        run: |
          git config --global user.name "OVRCR CI"
          git config --global user.email "ci@ovrcr.invalid"
      - name: Format
        run: cargo fmt --all -- --check
      # Clippy covers compilation too; a preceding cargo check duplicates work.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Doc tests
        run: cargo test --workspace --doc
