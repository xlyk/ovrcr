# Hosted runners are slow and shared; timing-sensitive PTY, socket and
# process-group tests race there. CI runs with `--profile ci`: a failing test is
# retried twice and reported as FLAKY instead of failing the job; after those
# retries are exhausted the suite fail-fasts so one red dashboard matcher does
# not burn the rest of the job. A hung test ends after five minutes. FLAKY in
# the log is the list of tests to harden; retries hide the red, not the defect.
[profile.ci]
retries = 2
# Stop the rest of the suite after a hard failure (retries still apply to that
# test). Keeps long server_lifecycle / dashboard runs from burning the job once
# one screen matcher is already red.
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(=server_lifecycle) & (test(=desktop_notifications_bridge_click_discards_transient_drafts_and_releases_capture) | test(=desktop_notifications_bridge_click_focuses_existing_split_without_duplicating_target) | test(=desktop_notifications_bridge_click_lands_in_browse_without_reviewing_or_answering))'
threads-required = "num-test-threads"

# Real owner-hash authentication has a fixed 1500ms budget; reserve an otherwise idle test runner.
[[profile.ci.overrides]]
filter = 'binary(=server_lifecycle) & test(=iterm_setup_real_palette_requires_separate_opt_in_and_uses_current_owned_dashboard)'
threads-required = "num-test-threads"
