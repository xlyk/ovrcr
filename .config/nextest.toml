# Hosted runners are slow and shared; timing-sensitive PTY, socket and
# process-group tests race there. CI runs with `--profile ci`: a failing test is
# retried twice and reported as FLAKY instead of failing the job, a test that
# fails every attempt still fails, and a hung test ends after five minutes
# instead of consuming the whole job. FLAKY in the log is the list of tests to
# harden; retries hide the red, not the defect.
[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
