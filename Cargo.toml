[package]
name = "ovrcr"
version = "0.1.0"
edition = "2024"
default-run = "ovrcr"

[features]
gui = ["dep:eframe", "dep:tempfile"]

[[bin]]
name = "ovrcr-gui"
path = "src/bin/ovrcr-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
croner = "=3.0.1"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
directories = "6"
eframe = { version = "0.36.1", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "x11"] }
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.9"
tempfile = { version = "3", optional = true }
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"
